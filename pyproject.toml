[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-finetuning-pipeline"
version = "1.0.0"
description = "End-to-End LLM Fine-Tuning Pipeline with QLoRA, SFTTrainer, TensorBoard, and Evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI Engineering Team"}
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.44.0",
    "peft>=0.12.0",
    "trl>=0.9.6",
    "accelerate>=0.33.0",
    "datasets>=2.20.0",
    "tensorboard>=2.15.0",
    "evaluate>=0.4.2",
    "rouge-score>=0.1.2",
    "nltk>=3.8.1",
    "scipy>=1.11.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "black>=24.0.0",
    "ruff>=0.5.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py310"
